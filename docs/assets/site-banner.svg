<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#1a0f0a"/><stop offset=".5" stop-color="#2a1409"/><stop offset="1" stop-color="#1a0f16"/></linearGradient>
<linearGradient id="btn" x1="0" x2="1"><stop offset="0" stop-color="#f26b35"/><stop offset="1" stop-color="#ff9a5c"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="gl" cx=".5" cy="1" r=".8"><stop offset="0" stop-color="#f26b35" stop-opacity=".55"/><stop offset="1" stop-color="#f26b35" stop-opacity="0"/></radialGradient>
<clipPath id="bc"><rect x="742" y="42" width="398" height="66" rx="33"/></clipPath>
<style>
.pulse{animation:p 2.4s ease-in-out infinite;transform-origin:941px 75px}
@keyframes p{50%{transform:scale(1.035)}}
.shine{animation:s 3.2s ease-in-out infinite}
@keyframes s{0%{transform:translateX(-260px)}60%,100%{transform:translateX(560px)}}
.arr{animation:a 1.4s ease-in-out infinite}
@keyframes a{50%{transform:translateX(7px)}}
.dot{animation:d 2s infinite}@keyframes d{50%{opacity:.25}}
</style></defs>
<rect width="1200" height="150" rx="22" fill="url(#bg)"/><rect width="1200" height="150" rx="22" fill="url(#gl)"/>
<rect x=".75" y=".75" width="1198.5" height="148.5" rx="21.5" fill="none" stroke="#f26b35" stroke-opacity=".5" stroke-width="1.5"/>
<image href="data:image/png;base64," x="42" y="27" width="96" height="96"/>
<circle class="dot" cx="172" cy="46" r="5" fill="#3fb950"/>
<text x="186" y="52" fill="#9be18b" font-size="15" font-weight="700" letter-spacing="2">LIVE WEBSITE</text>
<text x="170" y="92" fill="#ffffff" font-size="30" font-weight="800">Try CodeMerge live, in your browser</text>
<text x="171" y="123" fill="#c9b7ab" font-size="18">Interactive demo · working mini-tools · themes · videos</text>
<g class="pulse"><rect x="742" y="42" width="398" height="66" rx="33" fill="url(#btn)"/>
<g clip-path="url(#bc)"><rect class="shine" x="742" y="42" width="120" height="66" fill="url(#sh)" transform="skewX(-20)"/></g>
<text x="918" y="83" fill="#fff" font-size="20" font-weight="800" text-anchor="middle" style="letter-spacing:.2px">harelyaish.github.io/CodeMerge</text>
<g class="arr"><path d="M1100 75h20m-8-8 8 8-8 8" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</svg>