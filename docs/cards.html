<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeMerge — share cards</title>
<link rel="icon" href="assets/app-icon.png">
<style>
*{box-sizing:border-box;margin:0}
body{background:#0b0b0d;color:#f2f2f4;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding:32px 24px 60px}
.wrap{max-width:1100px;margin:0 auto}
a{color:#f26b35}
h1{font-size:32px;letter-spacing:-.02em;margin:8px 0 6px}
p.sub{color:#9a9aa3;margin-bottom:26px}
.bar{display:flex;flex-wrap:wrap;gap:22px;align-items:center;margin-bottom:22px}
.grp{display:flex;background:#0d0d10;border:1px solid #26262b;border-radius:10px;padding:3px;gap:3px}
.grp button{border:0;background:none;color:#9a9aa3;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
.grp button.on{background:#25252b;color:#f2f2f4}
.dl{margin-left:auto;background:#f26b35;color:#fff;border:0;border-radius:11px;padding:11px 22px;font:inherit;font-weight:600;cursor:pointer}
.preview{display:flex;justify-content:center;background:#141417;border:1px solid #26262b;border-radius:18px;padding:24px}
canvas{max-width:100%;max-height:74vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
small{display:block;color:#9a9aa3;margin-top:14px;font-size:13px}
</style>
</head>
<body><div class="wrap">
<a href="index.html">← CodeMerge</a>
<h1>Share cards</h1>
<p class="sub">Pick a template and a size, then download a PNG that's ready to post.</p>
<div class="bar">
  <div class="grp" id="tpl"><button data-v="promo" class="on">Promo</button><button data-v="tools">Tools</button><button data-v="themes">Themes</button></div>
  <div class="grp" id="size"><button data-w="1080" data-h="1080" class="on">Square 1080</button><button data-w="1080" data-h="1920">Story 9:16</button><button data-w="1200" data-h="630">Link 1200×630</button></div>
  <button class="dl" id="dl">Download PNG</button>
</div>
<div class="preview"><canvas id="c"></canvas></div>
<small>Built only from the CodeMerge icons and app logo. If Download does nothing when opened straight from disk, serve the folder (<code>python3 -m http.server</code>) — browsers block saving canvases from local files.</small>
</div>
<script>
const NAMES=["screenshot-full","screenshot-area","eject","clean-keyboard","quit-all","clipboard","file-shelf","prevent-sleep","window-split","now-playing","timer","color-picker","command-palette","screen-recording","weather","quick-note","lock-screen","converter","image-resizer","random-generator","audio-output","text-grab","kill-port"];
const img={};let ready=0;
function load(k,src){const i=new Image();i.onload=()=>{if(++ready===NAMES.length+1)draw()};i.src=src;img[k]=i}
load("app","assets/app-icon.png");NAMES.forEach(n=>load(n,`assets/icons/${n}.png`));
let tpl="promo",W=1080,H=1080;
const c=document.getElementById("c"),x=c.getContext("2d");
function rr(px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath()}
function bg(){
 x.fillStyle="#0b0b0d";x.fillRect(0,0,W,H);
 const g=x.createRadialGradient(W/2,H*1.05,0,W/2,H*1.05,Math.max(W,H)*.75);g.addColorStop(0,"rgba(242,107,53,.42)");g.addColorStop(1,"rgba(242,107,53,0)");x.fillStyle=g;x.fillRect(0,0,W,H)}
function text(t,px,py,size,w=700,col="#f5f5f7",al="center"){x.font=`${w} ${size}px -apple-system,"Helvetica Neue",Arial,sans-serif`;x.fillStyle=col;x.textAlign=al;x.fillText(t,px,py)}
function iconGrid(cx,cy,cols,size,gap,names){
 const rows=Math.ceil(names.length/cols);
 names.forEach((n,i)=>{const r=Math.floor(i/cols),cnt=r===rows-1?names.length-r*cols:cols,c0=i%cols,ox=(cols-cnt)*(size+gap)/2;
  x.drawImage(img[n],cx-(cols*size+(cols-1)*gap)/2+ox+c0*(size+gap),cy+r*(size+gap),size,size)})}
function draw(){
 c.width=W;c.height=H;bg();const tall=H>W*1.3,wide=W>H*1.5,u=Math.min(W,H*(wide?1.6:1));
 if(tpl==="promo"){
  const s=wide?150:tall?230:230;x.save();x.shadowColor="rgba(242,107,53,.5)";x.shadowBlur=60;
  const iy=wide?H*.5-s/2:tall?H*.2:H*.16;const ix=wide?W*.1:W/2-s/2;
  rr(ix,iy,s,s,s*.22);x.clip();x.drawImage(img.app,ix,iy,s,s);x.restore();
  if(wide){text("One menu bar.",W*.1+s+50,H*.46,74,800,"#f5f5f7","left");text("A dozen tools.",W*.1+s+50,H*.46+84,74,800,"#F26B35","left");text("$5 once. No subscription.",W*.1+s+50,H*.46+150,30,500,"#9a9aa3","left")}
  else{const ty=iy+s+(tall?120:100);text("One menu bar.",W/2,ty,tall?104:98,800);text("A dozen tools.",W/2,ty+(tall?116:110),tall?104:98,800,"#F26B35");
   text("The menu-bar utility for macOS",W/2,ty+(tall?230:210),tall?38:34,500,"#9a9aa3");text("$5 once. No subscription.",W/2,H-(tall?200:90),tall?46:40,700,"#f5f5f7")}
 }
 if(tpl==="tools"){
  text("Everything you reach for",W/2,H*(tall?.12:.14),wide?58:tall?84:78,800);text("in one click",W/2,H*(tall?.12:.14)+(wide?64:tall?92:86),wide?58:tall?84:78,800,"#F26B35");
  const cols=wide?8:tall?4:6,size=wide?86:tall?200:132,gap=wide?18:tall?26:26;iconGrid(W/2,H*(wide?.42:tall?.27:.3),cols,size,gap,NAMES);
  text("$5 once · harelyaish.gumroad.com/l/codemerge",W/2,H-(wide?34:tall?110:64),wide?24:tall?36:32,500,"#9a9aa3")
 }
 if(tpl==="themes"){
  text("Light. Dark.",W/2,H*(tall?.13:.15),wide?60:tall?96:86,800);text("Frosted glass.",W/2,H*(tall?.13:.15)+(wide?66:tall?106:96),wide?60:tall?96:86,800,"#F26B35");
  const L=[["#f7f7f8","#ED615E"],["#f0f2fa","#406BD9"],["#f0f5f0","#388C5C"],["#faf2ed","#D97340"],["#f2f2f2","#595959"],["#ffffff","#4D5C7A"]],D=[["#1c1c1f","#ED615E"],["#171c2b","#6B94EB"],["#17211c","#66AD85"],["#291c1a","#E6946B"],["#212121","#CCCCCC"],["#0f0f11","#C7D1E6"]];
  const cw=wide?150:tall?150:150,ch=wide?100:tall?150:150,gap=wide?16:tall?24:18,cols=wide?6:tall?3:6,startY=H*(tall?.3:wide?.44:.42);
  [L,D].forEach((set,ri)=>set.forEach(([b,a],i)=>{const col=tall?i%3:i,row=tall?Math.floor(i/3)+ri*2:ri;
   const totalW=cols*cw+(cols-1)*gap,px=W/2-totalW/2+col*(cw+gap),py=startY+row*(ch+gap+(wide?0:0));
   x.fillStyle=b;rr(px,py,cw,ch,22);x.fill();x.strokeStyle=ri?"rgba(255,255,255,.14)":"rgba(0,0,0,.08)";x.lineWidth=2;x.stroke();
   x.fillStyle=a;x.beginPath();x.arc(px+cw-28,py+28,10,0,7);x.fill();
   [[.4,.4],[.7,.6],[.55,.3]].forEach(([w,f],k)=>{x.fillStyle=ri?"#3c3c42":"#d6d6da";rr(px+18,py+ch*.42+k*(ch*.16),cw-36,8,4);x.fill();x.fillStyle=a;rr(px+18,py+ch*.42+k*(ch*.16),(cw-36)*w,8,4);x.fill()})}));
  text("12 themes · sun/moon quick switch",W/2,H-(wide?30:tall?110:64),wide?24:tall?36:32,500,"#9a9aa3")
 }
}
function bind(id,fn){document.getElementById(id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll(`#${id} button`).forEach(y=>y.classList.remove("on"));b.classList.add("on");fn(b)})}
bind("tpl",b=>{tpl=b.dataset.v;draw()});bind("size",b=>{W=+b.dataset.w;H=+b.dataset.h;draw()});
document.getElementById("dl").onclick=()=>c.toBlob(bl=>{const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=`codemerge-${tpl}-${W}x${H}.png`;a.click()});
</script>
</body>
</html>
