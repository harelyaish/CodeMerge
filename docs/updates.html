<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeMerge — changelog</title>
<meta name="description" content="Every CodeMerge release, live from GitHub: what's new, what changed, and how to update.">
<link rel="icon" href="assets/app-icon.png"><link rel="canonical" href="https://harelyaish.github.io/CodeMerge/updates.html">
<meta property="og:image" content="https://harelyaish.github.io/CodeMerge/assets/og.png">
<link rel="alternate" type="application/atom+xml" title="CodeMerge releases" href="https://github.com/harelyaish/CodeMerge/releases.atom">
<style>
:root{--bg:#0b0b0d;--card:#141417;--line:#26262b;--text:#f2f2f4;--muted:#9a9aa3;--orange:#f26b35;--orange2:#ff9a5c}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}.wrap{max-width:820px;margin:0 auto;padding:0 24px}
nav{border-bottom:1px solid var(--line);background:rgba(11,11,13,.8);backdrop-filter:blur(14px);position:sticky;top:0}nav .wrap{display:flex;justify-content:space-between;align-items:center;height:60px;max-width:1140px}
.brand{display:flex;gap:10px;align-items:center;font-weight:700}.brand img{width:28px;border-radius:7px}
.btn{display:inline-flex;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff}
.btn.g{background:var(--card);border:1px solid var(--line);color:var(--text)}
h1{font-size:clamp(34px,5vw,54px);letter-spacing:-.03em;margin:54px 0 10px}.lead{color:var(--muted);font-size:18px;margin-bottom:26px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:34px}
.tl{position:relative;padding-left:26px;border-left:2px solid var(--line);margin-left:6px}
.rel{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px}
.rel::before{content:"";position:absolute;left:-36px;top:28px;width:14px;height:14px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 5px var(--bg),0 0 0 6px var(--line)}
.rel.new::after{content:"LATEST";position:absolute;top:-10px;right:16px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;font-size:11px;font-weight:800;letter-spacing:.1em;padding:3px 10px;border-radius:99px}
.rel h2{font-size:22px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.rel h2 small{font-size:13px;color:var(--muted);font-weight:500}
.rel ul{margin:12px 0 0;padding-left:20px;color:var(--muted);font-size:14.5px;display:grid;gap:6px}.rel ul b{color:var(--text)}.rel h4{margin:14px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--orange)}
.rel p{color:var(--muted);font-size:14.5px;margin-top:8px}.dl{margin-top:14px;display:inline-block;font-size:13px;text-decoration:underline;color:var(--muted)}
footer{padding:40px 0;color:var(--muted);font-size:14px;text-align:center}
</style></head><body>
<nav><div class="wrap"><a class="brand" href="./"><img src="assets/app-icon.png" alt="">CodeMerge</a><a class="btn" href="./#updates">Suggest an idea</a></div></nav>
<div class="wrap">
<h1>Changelog</h1><p class="lead">Every release, live from GitHub. Update from Settings → General → Check for Updates, or run <code>brew upgrade --cask codemerge</code>.</p>
<div class="row"><a class="btn g" href="https://github.com/harelyaish/CodeMerge/releases.atom">RSS feed</a><a class="btn g" href="https://github.com/harelyaish/CodeMerge/releases/latest">Download latest</a><a class="btn g" href="./#updates">Am I up to date?</a></div>
<div class="tl" id="tl"><div class="rel new"><h2>Loading releases…</h2></div></div>
<footer><a href="./" style="text-decoration:underline">← Back to CodeMerge</a></footer></div>
<script>
function md(t){t=(t||"").replace(/</g,"&lt;");const o=[];let ul=false;t.split(/\r?\n/).forEach(l=>{if(/^#{1,4}\s/.test(l)){if(ul){o.push("</ul>");ul=false}o.push("<h4>"+l.replace(/^#+\s/,"")+"</h4>")}else if(/^\s*[-*]\s/.test(l)){if(!ul){o.push("<ul>");ul=true}o.push("<li>"+l.replace(/^\s*[-*]\s/,"").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")+"</li>")}else if(l.trim()){if(ul){o.push("</ul>");ul=false}o.push("<p>"+l.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")+"</p>")}});if(ul)o.push("</ul>");return o.join("")}
fetch("https://api.github.com/repos/harelyaish/CodeMerge/releases").then(r=>r.json()).then(rs=>{if(!Array.isArray(rs)||!rs.length)throw 0;
 document.getElementById("tl").innerHTML=rs.map((r,i)=>`<div class="rel ${i?"":"new"}"><h2>${r.name||r.tag_name} <small>${new Date(r.published_at).toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})}</small></h2>${md(r.body)||"<p>No notes.</p>"}<a class="dl" href="${r.html_url}">View on GitHub</a></div>`).join("")}).catch(()=>{document.getElementById("tl").innerHTML='<div class="rel"><h2>Couldn\'t load releases</h2><p>See them on <a class="dl" href="https://github.com/harelyaish/CodeMerge/releases">GitHub</a>.</p></div>'});
</script></body></html>
