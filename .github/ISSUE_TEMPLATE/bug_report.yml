name: Report a bug
description: Something in CodeMerge isn't working the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the dropdown
        2. Click …
        3. …
  - type: input
    id: app-version
    attributes:
      label: CodeMerge version
      description: Settings → General, or the CodeMerge menu.
      placeholder: e.g. 1.1.3
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.4, Apple Silicon
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Drag images in here if they help.
