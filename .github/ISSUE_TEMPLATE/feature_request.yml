name: Request a feature
description: An idea for something CodeMerge should do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like CodeMerge to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would it help you with?
      description: The problem behind the idea helps get it right.
